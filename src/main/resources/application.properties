spring.application.name=harshit-spring-ai
# Server
server.port=8080

# Spring AI - OpenAI
#spring.ai.openai.api-key=
spring.ai.openai.api-key=${OPENAI_API_KEY}


# PostgreSQL Database Connections
spring.datasource.url=jdbc:postgresql://localhost:5433/Progression?currentSchema=concept_planning
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Embedding model
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Chat model
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# ollama configuration
#spring.ai.ollama.base-url = http://localhost:11434
#spring.ai.ollama.chat.options.model= codellama:latest


# JWT Security
jwt.secret = "HarshitSpringAIJwtSecretKeyForDevelopmentOnlyChangeThisInProduction123456789"
jwt.access-token-expiration= 9000000


#email
spring.mail.host= smtp.gmail.com
spring.mail.port= 587
spring.mail.username= ${MAIL_USERNAME}
spring.mail.password= ${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth= true
spring.mail.properties.mail.smtp.starttls.enable= true

spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=concept_planning
spring.ai.vectorstore.pgvector.initialize-schema= true
spring.ai.vectorstore.pgvector.index-type= HNSW
spring.ai.vectorstore.pgvector.distance-type= COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions= 1536
spring.ai.vectorstore.pgvector.max-document-batch-size= 10000


logging.level.ai=DEBUG